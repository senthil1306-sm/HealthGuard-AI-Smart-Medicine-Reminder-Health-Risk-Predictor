<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthGuard AI - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-orbs"><div class="orb-1"></div><div class="orb-2"></div></div>
    
    <div class="login-wrapper">
        <div class="glass-panel login-box">
            <h1 class="text-gradient" style="margin-bottom: 2rem; font-size: 2.2rem; font-weight: 800;"><i class="fas fa-shield-heart"></i> HealthGuard AI</h1>
            <h3 style="margin-bottom: 1.5rem; color: #fff;">Access Your Health Hub</h3>
            
            <form id="authForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group" style="text-align: left;">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="demo@university.edu" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> Enter Dashboard
                </button>
            </form>
            <p style="margin-top: 1.5rem; font-size: 0.85rem;">For demo purposes, entering any email will auto-login.</p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const btn = document.querySelector('.btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            
            try {
                const res = await api.request('/auth/login', 'POST', { email, password: 'password123' });
                if(res.token) {
                    window.location.href = 'dashboard.html';
                }
            } catch(e) {
                alert("Login Error!");
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Enter Dashboard';
            }
        }
    </script>
</body>
</html>
